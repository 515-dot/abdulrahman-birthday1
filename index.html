<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جيوجرافي للعقارات — نظام إدارة العملاء</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login" class="login-wrap">
  <form id="loginForm" class="card login-card" novalidate>
    <img src="logo.jpg" alt="Geography Real Estate" class="logo">
    <h1>تسجيل الدخول</h1>
    <p class="muted demo-note">واجهة تجريبية: لا يوجد تحقق حقيقي من الحساب، والبيانات للعرض فقط.</p>
    <label>البريد الإلكتروني
      <input name="email" type="email" dir="ltr" autocomplete="username" required>
    </label>
    <label>كلمة المرور
      <span class="pw">
        <input name="password" id="pw" type="password" dir="ltr" autocomplete="current-password" required>
        <button type="button" id="togglePw" class="ghost" aria-label="إظهار كلمة المرور">👁</button>
      </span>
    </label>
    <label class="check"><input type="checkbox" name="remember"> تذكرني</label>
    <p id="loginError" class="error" role="alert" hidden>أدخل البريد الإلكتروني وكلمة المرور.</p>
    <button class="btn" type="submit">تسجيل الدخول</button>
  </form>
</section>

<div id="app" class="app" hidden>
  <aside class="side">
    <img src="logo.jpg" alt="Geography Real Estate" class="logo-side">
    <nav id="nav" aria-label="التنقل الرئيسي"></nav>
  </aside>
  <div class="main-col">
    <header class="top">
      <h2 id="title"></h2>
      <div class="user"><span id="userName"></span><button id="logout" class="ghost">خروج</button></div>
    </header>
    <main id="view"></main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
